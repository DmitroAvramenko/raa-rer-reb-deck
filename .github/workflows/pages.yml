name: Deploy deck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 --print-to-pdf="$PWD/RAA_RER-REB_2026-11.pdf" "file://$PWD/index.html"
          ls -la RAA_RER-REB_2026-11.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
